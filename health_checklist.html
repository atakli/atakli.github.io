<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blueprint Rutin Takibi</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --accent-color: #2ecc71;
            --sub-accent-color: #3498db;
            --border-color: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .subtitle a {
            color: var(--sub-accent-color);
            text-decoration: none;
            border-bottom: 1px dashed var(--sub-accent-color);
        }
        .subtitle a:hover {
            color: #2980b9;
            border-bottom-style: solid;
        }
        .progress-container {
            position: sticky;
            top: 10px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            z-index: 100;
        }
        .progress-bar {
            background: var(--border-color);
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-fill {
            background: var(--accent-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .category {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .category h2 {
            font-size: 1.2rem;
            margin: 0;
            color: #34495e;
        }
        .cat-progress-text {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--sub-accent-color);
            background: #e8f4fd;
            padding: 2px 8px;
            border-radius: 12px;
        }
        .cat-progress-bar {
            background: var(--border-color);
            height: 4px;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 15px;
            margin-top: -6px;
        }
        .cat-progress-fill {
            background: var(--sub-accent-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .todo-item {
            display: flex;
            align-items: flex-start;
            margin: 12px 0;
            cursor: pointer;
            user-select: none;
        }
        .todo-item input {
            margin-top: 5px;
            margin-right: 12px;
            transform: scale(1.2);
            cursor: pointer;
        }
        .todo-item span {
            font-size: 0.95rem;
        }
        .todo-item .time-stamp {
            color: var(--sub-accent-color);
            font-weight: bold;
            font-size: 0.85rem;
            margin-left: 5px;
        }
        .todo-item .details {
            display: block;
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: 2px;
        }
        .todo-item.checked span {
            text-decoration: line-through;
            color: #95a5a6;
        }
        .todo-item.checked .details {
            text-decoration: none;
            color: #bdc3c7;
        }
        .source-link {
            text-align: center;
            margin-top: 30px;
            font-size: 0.85rem;
        }
        .source-link a {
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Blueprint Rutin Takibi</h1>
    <div class="subtitle">Bryan Johnson'ın <a href="https://www.youtube.com/shorts/_L-pjxsd2HU" target="_blank">videosundaki</a> tavsiyeler</div>

    <div class="progress-container">
        <div id="progress-text">Genel İlerleme: 0 / 0 (%0)</div>
        <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
    </div>

    <div id="checklist-content"></div>

    <div class="source-link">
        Kaynak video: <a href="https://www.youtube.com/shorts/_L-pjxsd2HU" target="_blank">everything i've learned (YouTube)</a>
    </div>
</div>

<script>
const data = [
    {
        title: "🛌 Uyku ve Gece Rutini",
        items: [
            { text: "Yatakta 8 saat geçirmek (Dünyanın en güçlü ilacı uykudur)" },
            { text: "Her gece aynı saatte yatmak" },
            { text: "Gece yarısından (00:00) önce yatağa girmiş olmak" },
            { text: "Uykudan hemen önce hiçbir şey yememek" },
            { text: "Akşam yemeğinde hafif ve sakinleştirici gıdalar tüketmek" },
            { text: "Yatmadan 1 saat önce tüm ekranları (telefon, TV, PC) kapatmak" },
            { text: "Yatmadan önce kitap okumak" },
            { text: "Yatmadan önce 1 saatlik gevşeme/rahatlama rutini uygulamak" },
            { text: "Soğuk bir odada uyumak" }
        ]
    },
    {
        title: "🥗 Beslenme ve Gıda Alışkanlıkları",
        items: [
            { text: "İlave şekerden uzak durmak" },
            { text: "Kızarmış yiyeceklerden kaçınmak" },
            { text: "Hazır ve paketli atıştırmalıklardan uzak durmak" },
            { text: "İşlenmemiş, bütünsel gıdalar (whole foods) tüketmek" },
            { text: "Gün içinde su içmek için bilinçli çaba göstermek" },
            { text: "Alkolden tamamen uzak durmak" },
            { text: "Kahve tüketimini öğlen 12:00'den önce bitirmek" },
            { text: "Gerekliyse/Obezite durumunda GLP-1 gibi tıbbi destekleri değerlendirmek" }
        ]
    },
    {
        title: "🏋️‍♂️ Gelişmiş Egzersiz ve Uzun Yaşam Protokolü",
        items: [
            { 
                text: "Güç Antrenmanı (Strength Training)", 
                time: "03:30", 
                desc: "Haftada en az 3 gün tüm vücudu çalıştıran bileşik (compound) hareketlere (itme, çekme, squat) odaklanın, kademeli yük artırımı yapın. Kas sağlığı erken ölüm riskini %20-35 azaltan metabolik bir zırhtır." 
            },
            { 
                text: "Düşük Yoğunluklu Kardiyo (Zone 2)", 
                time: "05:54", 
                desc: "Haftada toplam 150 dakika yürüyüş, koşu, bisiklet veya yüzme hedefleyin (Konuşma testi: Rahatça konuşabilmelisiniz). Mitokondri gelişimini ve yağ yakımını optimize eder." 
            },
            { 
                text: "Yemek Sonrası 10 Dakikalık Kısa Yürüyüşler", 
                time: "07:26", 
                desc: "Yemeklerden hemen sonra kan şekerini dengelemek açısından oldukça etkilidir." 
            },
            { 
                text: "Yüksek Yoğunluklu Kardiyo (Zone 4 & 5)", 
                time: "07:45", 
                desc: "Haftada 75 dakika yüksek yoğunluklu kardiyo (maksimum kalp hızının %80-90'ı) yapın veya Norveç 4x4 protokolünü uygulayın. Kalp-akciğer kapasitesini (VO2 max) ve doğrudan yaşam süresini artırır." 
            },
            { 
                text: "Mobilite ve Esneklik (Mobility & Flexibility)", 
                time: "10:37", 
                desc: "Her gün kalça, omurga, ayak bilekleri, hamstring ve omuzları esneten 5-10 dakikalık rutinler uygulayın. İlerleyen yaşta bağımsız ve özgür hareket imkanı sağlar." 
            },
            { 
                text: "Denge Çalışmaları (Balance)", 
                time: "11:56", 
                desc: "Günlük rutinlere gözleri kapatarak tek ayak üzerinde durma çalışması (single-leg stands) ekleyin. Nörolojik sağlığı korur (Tek ayak üzerinde 10 saniye duramayanların erken ölüm riski yüksektir)." 
            },
            { 
                text: "Bryan Johnson Yaklaşımı: İstikrarı Yakalamak", 
                time: "13:34", 
                desc: "Mükemmel veya aşırı yoğun bir programa takılmak yerine, bu sütunları tutarlı bir şekilde hayatın bir parçası haline getirerek yaşlandığında kimseye muhtaç olmayan bir vücut inşa et." 
            }
        ]
    },
    {
        title: "🏃‍♂️ Egzersiz ve Günlük Hareket (Temel)",
        items: [
            { text: "Yemeklerden sonra hafif yürüyüş veya 'air squat' yapmak" },
            { text: "Nabzı düzenli olarak yüksek seviyelere çıkaracak kardiyo yapmak" },
            { text: "Düzenli olarak ağır yükler kaldırmak (ağırlık antrenmanı)" },
            { text: "Her gün esneme (stretching) egzersizleri yapmak" },
            { text: "Gün içinde dik durmaya özen göstermek" },
            { text: "Uzun süre hareketsiz oturmaktan kaçınmak" }
        ]
    },
    {
        title: "🦷 Hijyen ve Genel Sağlık",
        items: [
            { text: "Eve girerken kapıda ayakkabıları çıkarmak" },
            { text: "Sabah ve akşam: Diş ipi kullanmak, diş fırçalamak ve dil kazımak" },
            { text: "Düzenli olarak diş hekimine gitmek" },
            { text: "Yüksek sese karşı işitme duyusunu korumak" },
            { text: "Sigara, vape veya dumanlı herhangi bir şeyi asla içmemek" }
        ]
    },
    {
        title: "☀️ Işık ve Çevre Yönetimi",
        items: [
            { text: "Sabah uyanır uyanmaz güneş ışığı almak" },
            { text: "Gün ortasındaki dik güneş ışınlarından cildi korumak" },
            { text: "Gün batımından sonra parlak ışıklara maruz kalmamak" },
            { text: "Hayatın her alanında plastik kullanımını olabildiğince azaltmak" },
            { text: "Yaşanılan odalardaki havayı düzenli olarak havalandırmak" }
        ]
    },
    {
        title: "🧠 Zihinsel Sağlık, Dijital Detoks ve Sosyal Yaşam",
        items: [
            { text: "Stres anlarında durup derin nefes egzersizi yapmak" },
            { text: "Haftada en az bir kez bir arkadaşla fiziksel olarak görüşmek" },
            { text: "Telefondaki tüm bildirimleri kapatmak" },
            { text: "Sosyal medya kullanımını ciddi oranda sınırlandırmak" },
            { text: "Araç kullanırken asla mesajlaşmamak" }
        ]
    },
    {
        title: "⏳ Yaşam Felsefesi",
        items: [
            { text: "Vücudun bir saat olduğunu unutmayıp rutinlere sadık kalmak" },
            { text: "Mümkün mertebe uzun mesafeli seyahatlerden kaçınmak" },
            { text: "Daha az şey yapmaya odaklanmak (Çünkü çoğu şey zaten işe yaramaz)" }
        ]
    }
];

const contentDiv = document.getElementById('checklist-content');
let totalItemsCount = 0;

// DOM Oluşturma aşaması
data.forEach((cat, catIdx) => {
    const catDiv = document.createElement('div');
    catDiv.className = 'category';
    catDiv.setAttribute('data-cat-idx', catIdx);
    
    catDiv.innerHTML = `
        <div class="category-header">
            <h2>${cat.title}</h2>
            <span id="cat-text-${catIdx}" class="cat-progress-text">%0</span>
        </div>
        <div class="cat-progress-bar">
            <div id="cat-fill-${catIdx}" class="cat-progress-fill"></div>
        </div>
    `;
    
    cat.items.forEach((item, itemIdx) => {
        const itemId = `item_${catIdx}_${itemIdx}`;
        totalItemsCount++;
        
        const itemLabel = document.createElement('label');
        itemLabel.className = 'todo-item';
        itemLabel.setAttribute('for', itemId);
        
        const isChecked = localStorage.getItem(itemId) === 'true';
        if(isChecked) itemLabel.classList.add('checked');

        const timeSpan = item.time ? `<span class="time-stamp">[${item.time}]</span>` : '';
        const descSpan = item.desc ? `<span class="details">${item.desc}</span>` : '';

        itemLabel.innerHTML = `
            <input type="checkbox" id="${itemId}" data-cat="${catIdx}" ${isChecked ? 'checked' : ''} onchange="toggleItem('${itemId}', ${catIdx})">
            <div>
                <span>${item.text} ${timeSpan}</span>
                ${descSpan}
            </div>
        `;
        catDiv.appendChild(itemLabel);
    });
    contentDiv.appendChild(catDiv);
});

function toggleItem(id, catIdx) {
    const checkbox = document.getElementById(id);
    const label = checkbox.parentElement.parentElement; // div ve label katmanları için
    
    localStorage.setItem(id, checkbox.checked);
    
    if(checkbox.checked) {
        label.classList.add('checked');
    } else {
        label.classList.remove('checked');
    }
    updateProgress();
}

function updateProgress() {
    let globalCheckedCount = 0;
    
    data.forEach((cat, catIdx) => {
        const catTotal = cat.items.length;
        let catChecked = 0;
        
        cat.items.forEach((_, itemIdx) => {
            const itemId = `item_${catIdx}_${itemIdx}`;
            if(localStorage.getItem(itemId) === 'true') {
                catChecked++;
                globalCheckedCount++;
            }
        });
        
        const catPercent = catTotal > 0 ? Math.round((catChecked / catTotal) * 100) : 0;
        document.getElementById(`cat-text-${catIdx}`).innerText = `%${catPercent}`;
        document.getElementById(`cat-fill-${catIdx}`).style.width = `${catPercent}%`;
    });
    
    const globalPercent = totalItemsCount > 0 ? Math.round((globalCheckedCount / totalItemsCount) * 100) : 0;
    document.getElementById('progress-text').innerText = `Genel İlerleme: ${globalCheckedCount} / ${totalItemsCount} (%${globalPercent})`;
    document.getElementById('progress-fill').style.width = `${globalPercent}%`;
}

updateProgress();
</script>

</body>
</html>
